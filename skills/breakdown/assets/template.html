<title>/breakdown animation</title>
<!--
  The /breakdown skill's animation: a product turns on a studio turntable, pulls apart into its parts, and every part
  gets a label. The product is described in the spec as parts (rounded slabs, frames, boxes, cylinders, rings, lenses,
  spheres, capsules, cones, tori and lathe profiles, sizes in millimetres) with materials (glass, metals, plastics, PCB,
  battery, coil, fabric, wood...) and an explode level; the user's product photo can be mapped onto a part's top face.
  three.js r180 from jsDelivr. scripts/render.py inlines the spec where it says SPEC below and records the page frame by
  frame; opened on its own, the page plays in a loop.
-->

// ---------------- assemble the product ----------------
const PARTS = (S.parts && S.parts.length ? S.parts : DEFAULT.parts).map((p, i) => Object.assign({i}, p));
const AXIS = new THREE.Vector3(...(S.axis === 'x' ? [1, 0, 0] : S.axis === 'z' ? [0, 0, 1] : [0, 1, 0]));
const parts = [];
function buildAll() {
  PARTS.forEach(p => {
    const holder = new THREE.Group(), base = p.pos ? p.pos.map(Number) : [Number(p.x || 0), Number(p.y || 0), Number(p.z || 0)];
    const copies = p.copies ? p.copies.map(c => Array.isArray(c) ? (c.length === 3 ? c.map(Number) : [Number(c[0]), 0, Number(c[1])]) : Object.assign((c.pos || [0, 0, 0]).map(Number), {rot: c.rot})) : [[0, 0, 0]];
    if (p.grid) { const g = p.grid, nx = g.nx || 1, nz = g.nz || 1, px = g.pitch || g.px || 10, pz = g.pitchZ || g.pz || px; copies.length = 0;
      for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) copies.push([(i - (nx - 1) / 2) * px, 0, (k - (nz - 1) / 2) * pz]); }
    copies.forEach(c => { const s = buildShape(c.rot ? Object.assign({}, p, {rot: c.rot}) : p); s.position.set(c[0], c[1], c[2]); holder.add(s); });
    holder.position.set(...base); root.add(holder);

const box3 = new THREE.Box3(), tmpBox = new THREE.Box3();
function bounds(q) { place(q); root.updateMatrixWorld(true); box3.makeEmpty(); parts.forEach(o => { tmpBox.setFromObject(o.holder); box3.union(tmpBox); }); return box3.clone(); }
let GAP = 0;
function place(q) { parts.forEach(o => { const off = o.off ? o.off.clone() : AXIS.clone().multiplyScalar(o.level * GAP); o.holder.position.copy(o.base).addScaledVector(off, q); }); }

// ---------------- timing and camera ----------------
const LABELLED = () => parts.filter(o => o.p.label !== false);
let T_TURN, T_APART0, T_APART1, T_LAB0, B0, B1, C0, C1, R0, R1;
const LABEL_X = P ? 0.60 : 0.62;
function plan() {
  const b = bounds(0), sz = b.getSize(new THREE.Vector3()); GAP = Number(S.gap) || Math.max(6, 0.19 * Math.max(sz.x, sz.z, sz.y));
  B0 = b; B1 = bounds(1); place(0);
  C0 = B0.getCenter(new THREE.Vector3()); C1 = B1.getCenter(new THREE.Vector3());
  R0 = B0.getBoundingSphere(new THREE.Sphere()).radius; R1 = B1.getBoundingSphere(new THREE.Sphere()).radius;
  const n = LABELLED().length;
  T_TURN = 0; T_APART0 = Number(S.apartAt || 1.5); T_APART1 = T_APART0 + 0.95; T_LAB0 = T_APART1 - 0.05;
  window.DURATION = Number(S.duration) || Math.max(6, T_LAB0 + 0.1 * n + 0.3 + 2.6);   // time to read every label
  const sc = Math.max(R1, 1); key.position.set(-1.1 * sc, 1.8 * sc, 1.0 * sc); key.target.position.copy(C1);
  Object.assign(key.shadow.camera, {left: -sc * 1.3, right: sc * 1.3, top: sc * 1.3, bottom: -sc * 1.3, near: sc * 0.05, far: sc * 6}); key.shadow.camera.updateProjectionMatrix();
  rim.position.set(1.5 * sc, 0.8 * sc, -1.5 * sc); warm.position.set(1.0 * sc, 0.4 * sc, 1.1 * sc); warm.intensity = 2200 * Math.pow(sc / 90, 1.6) / 1;

}
// The camera fits the product's real on-screen size every frame: the bounding box (assembled -> exploded) is turned with

// frame (the whole width while assembled; the left part once the labels need the right side).
const _m = new THREE.Matrix4(), _c = new THREE.Vector3();
function frameIt(bmin, bmax, el, share, cx, cy) {

  const c = corners.reduce((a, v) => a.add(v), new THREE.Vector3()).multiplyScalar(1 / 8);

    camera.clearViewOffset(); camera.position.set(c.x, c.y + d * Math.sin(el), c.z + d * Math.cos(el)); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    corners.forEach(v => { _c.copy(v).project(camera); const px = (_c.x + 1) / 2 * W, py = (1 - _c.y) / 2 * H; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); });
    const k = Math.max((x1 - x0) / (W * share[0]), (y1 - y0) / (H * share[1]));

}
function pose(t) {
  const q = E.io(prog(t, T_APART0, T_APART1)); place(q);
  root.rotation.y = Number(S.spin != null ? S.spin : 0.95) - Number(S.spinSpeed != null ? S.spinSpeed : 0.07) * t;
  _m.makeRotationY(root.rotation.y);
  const o = E.io(prog(t, T_APART0 - 0.2, T_APART1 + 0.35));
  const el = THREE.MathUtils.degToRad(lerp(Number(S.elevation0 || 38), Number(S.elevation1 || 24), o));
  const bmin = B0.min.clone().lerp(B1.min, q), bmax = B0.max.clone().lerp(B1.max, q);
  const top = (TY + (TT.lines.length - 1) * TLH + (S.subtitle ? 110 : 70) * U) / H, bottom = P ? 0.80 : 0.94;
  frameIt(bmin, bmax, el, [lerp(P ? 0.80 : 0.62, P ? 0.52 : 0.46, o), (bottom - top) * lerp(0.86, 0.94, o)], lerp(0.5, P ? 0.33 : 0.36, o), (top + bottom) / 2);

}

// ---------------- labels ----------------
const ui = uic.getContext('2d'), _v = new THREE.Vector3();
let TT, TLH, TY;
function project(v) { _v.copy(v).project(camera); return [(_v.x + 1) / 2 * W, (1 - _v.y) / 2 * H]; }
function anchorOf(o) {   // the point of the part furthest right on screen, on its own top face (sampled in the part's own space)
  let best = null; o.holder.updateMatrixWorld(true);
  const first = o.holder.children[0] || o.holder;          // one copy only, so the dot doesn't jump between copies as it turns
  first.traverse(m => {
    if (!m.isMesh) return; if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb = m.geometry.boundingBox, cx = (bb.min.x + bb.max.x) / 2, cz = (bb.min.z + bb.max.z) / 2, rx = (bb.max.x - bb.min.x) / 2 * 0.9, rz = (bb.max.z - bb.min.z) / 2 * 0.9;
    const mid = new THREE.Vector3(cx, (bb.min.y + bb.max.y) / 2, cz).applyMatrix4(m.matrixWorld).y;
    for (const yy of [bb.max.y, bb.min.y]) for (let k = 0; k < 24; k++) {   // the face that is up in the world (a flipped part's local bottom)
      const a = k / 24 * Math.PI * 2, v = new THREE.Vector3(cx + rx * Math.cos(a), yy, cz + rz * Math.sin(a)).applyMatrix4(m.matrixWorld);
      if (v.y < mid - 1e-6) continue; const p = project(v); if (!best || p[0] > best[0]) best = p; }

function labels(t) {
  ui.clearRect(0, 0, W, H);
  const q0 = E.out5(prog(t, -0.25, 0.3));
  ui.save(); ui.globalAlpha = q0; ui.translate(0, (1 - q0) * 22 * U); ui.fillStyle = LIGHT ? '#15171c' : '#ffffff'; ui.textAlign = 'center'; ui.textBaseline = 'alphabetic';
  ui.font = `800 ${TT.size}px ${FONT}`; ui.letterSpacing = '-2px'; TT.lines.forEach((l, i) => ui.fillText(l, W / 2, TY + i * TLH)); ui.letterSpacing = '0px';
  if (S.subtitle) { ui.font = `600 ${44 * U}px ${FONT}`; ui.fillStyle = LIGHT ? '#5b606b' : 'rgba(255,255,255,0.65)'; ui.fillText(S.subtitle, W / 2, TY + (TT.lines.length - 1) * TLH + 70 * U); }
  ui.restore();
  if (t < T_LAB0 - 0.05) return;
  root.updateMatrixWorld(true);
  const items = LABELLED().map(o => ({t: typeof o.p.label === 'string' ? o.p.label : (o.p.name || ''), p: anchorOf(o)})).filter(it => it.t);
  const sorted = items.sort((a, b) => a.p[1] - b.p[1]), sp = 80 * U, top = TY + (TT.lines.length - 1) * TLH + (S.subtitle ? 130 : 90) * U, bottom = P ? H * 0.80 : H * 0.92;
  let yy = -1e9; sorted.forEach(p => { p.ly = Math.max(p.p[1], yy + sp); yy = p.ly; });
  const over = Math.max(0, sorted.length ? sorted[sorted.length - 1].ly - bottom : 0); sorted.forEach(p => p.ly -= over);
  const under = Math.max(0, sorted.length ? top - sorted[0].ly : 0); sorted.forEach(p => p.ly += under);
  const lx = W * LABEL_X + 110 * U, fs = 42 * U, maxW = W - lx - 28 * U;
  sorted.forEach((p, i) => {
    const a = E.out(prog(t, T_LAB0 + 0.10 * i, T_LAB0 + 0.10 * i + 0.26)); if (a <= 0) return;
    const [x, y] = p.p, q = E.out(clamp(a * 1.25)), ex = lx - 22 * U, ey = p.ly;

    let s = fs; ui.font = `650 ${s}px ${FONT}`; while (s > 22 * U && ui.measureText(p.t).width > maxW) { s -= 1; ui.font = `650 ${s}px ${FONT}`; }
    ui.textAlign = 'left'; ui.textBaseline = 'middle'; ui.fillText(p.t, lx - 8 * U + (1 - a) * 18 * U, ey + 2 * U);

}
function layoutText() {

  TLH = TT.size * 1.12; TY = (P ? H * 0.149 : H * 0.12) + (TT.lines.length < 2 ? TLH * 0.3 : 0);
}

// ---------------- go ----------------
async function start() {
  if (S.photo) PHOTO = await new Promise(res => new THREE.TextureLoader().load(S.photo, tex => { tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; res(tex); }, undefined, () => res(null)));
  await loadFonts([`800 92px Inter`, `650 44px Inter`, `700 110px Inter`]);
  buildAll(); TEXS.forEach(f => f()); plan(); layoutText();
  window.render = t => { pose(t); renderer.render(scene, camera); labels(t); return true; };

}
start().catch(e => { window.renderError = String(e && e.stack || e); console.error(e); });
</script>
