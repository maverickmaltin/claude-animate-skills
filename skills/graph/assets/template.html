<title>/graph animation</title>
<!--
  The /graph skill's animation: your numbers become a chart that builds itself on screen.
  Bars (up to 10 values) grow one after another with their counts ticking up; longer series draw as a line with a live
  value at its head. A growth tag pops at the end. scripts/render.py inlines the spec where it says SPEC below and
  records the page frame by frame; opened on its own, the page just plays in a loop.
-->
