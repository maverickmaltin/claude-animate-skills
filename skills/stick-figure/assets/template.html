<title>/stick-figure animation</title>
<!--
  The /stick-figure skill's animation: a cartoon explainer acted out by stick figures.
  A title and a one-line answer on top, a scene (street, park, room, office, classroom, night, plain) with props, and
  one to four stick figures playing timed beats: walk, run, wave, talk, yawn, look, point, think, shrug, jump, cheer,
  surprised, sad, sleep, laugh, dance, idea, fall. Speech and thought bubbles, small icons (heart, idea bulb, ?, !, Zzz)
  and dotted arrows between figures. scripts/render.py inlines the spec where it says SPEC below and records the page
  frame by frame; opened on its own, the page plays in a loop.
-->
